<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O3 Cloud Central · Primeiro acesso</title><link rel="icon" href="/favicon.ico" type="image/x-icon"><script src="/theme.js"></script><link rel="stylesheet" href="/style.css"><script src="/first-access.js" defer></script></head><body class="login-page"><main class="login-main"><section class="login-card"><img src="/brand/logo.png" width="100" height="64" alt="O3 Cloud"><h1>Defina sua senha</h1><p>Antes de continuar, substitua a senha inicial do administrador por uma senha com pelo menos 12 caracteres.</p><form id="first-access-form"><label>Senha atual<input type="password" name="current_password" autocomplete="current-password" required maxlength="256"></label><label>Nova senha<input type="password" name="new_password" autocomplete="new-password" required minlength="12" maxlength="256"></label><label>Confirmar nova senha<input type="password" name="confirmation" autocomplete="new-password" required minlength="12" maxlength="256"></label><p id="first-access-error" class="form-error" role="alert" hidden></p><button type="submit">Salvar senha e entrar novamente</button></form></section></main></body></html>
