[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "o3-cloud-central"
version = "0.7.3"
description = "O3 Cloud Central: managed customer access with Python agents and MariaDB"
requires-python = ">=3.11"
dependencies = [
  "asyncssh==2.24.1",
  "aiohttp==3.14.5",
  "httpx==0.28.1",
  "cryptography==50.0.1",
]

[project.optional-dependencies]
central = [
  "fastapi==0.143.3",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.1.4",
  "PyMySQL[rsa]==1.2.3",
]
windows = [
  "pywin32==312; sys_platform == 'win32'",
  "pystray==0.19.5; sys_platform == 'win32'",
  "Pillow==12.3.0; sys_platform == 'win32'",
]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]
build = ["pyinstaller==6.22.3"]

[project.scripts]
o3cloudcentral = "o3cloudcentral.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
include = ["o3cloudcentral*"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
asyncio_mode = "auto"
filterwarnings = ["error::RuntimeWarning"]
